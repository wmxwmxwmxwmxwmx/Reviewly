openapi: 3.1.0
info:
  title: PRism API
  version: 1.0.0
  description: REST API served by services/gateway
servers:
  - url: http://localhost:3001
paths:
  /health:
    get:
      summary: Health check
  /api/ai/chat:
    post:
      summary: AI chat proxy
  /api/dashboard:
    get:
      summary: Dashboard stats
  /api/dashboard/weekly-summary:
    post:
      summary: Generate weekly AI dashboard summary (on demand)
  /api/repos:
    get:
      summary: List repositories
  /api/repos/sync:
    post:
      summary: Sync repository metadata from GitHub (no clone, no PR diffs)
  /api/repos/{repoId}/analyze-context:
    get:
      summary: Context for on-demand repository AI analysis
  /api/repos/{repoId}/clone:
    post:
      summary: Clone repository (reserved, not implemented)
  /api/pull-requests:
    get:
      summary: List pull requests
  /api/pull-requests/{id}:
    get:
      summary: Get pull request
  /api/pull-requests/{id}/diff:
    get:
      summary: Get PR diff
  /api/pull-requests/{id}/analysis:
    post:
      summary: Start analysis job
  /api/pull-requests/{id}/analysis/latest:
    get:
      summary: Latest analysis summary
  /api/pull-requests/{id}/findings:
    get:
      summary: Analysis findings
  /api/analysis/jobs/{jobId}:
    get:
      summary: Get analysis job
  /api/security/findings:
    get:
      summary: List security findings (filtered, paginated)
      parameters:
        - name: severity
          in: query
          schema: { type: string }
        - name: repo
          in: query
          schema: { type: string }
        - name: q
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
    post:
      summary: Create security finding
  /api/security/findings/{findingId}/explain:
    post:
      summary: AI explain finding (SSE stream, on-demand)
  /api/security/findings/{findingId}:
    get:
      summary: Get security finding
    patch:
      summary: Update security finding
    delete:
      summary: Delete security finding
  /api/security/stats:
    get:
      summary: Security stats
  /api/performance/stats:
    get:
      summary: Performance stats
  /api/performance/findings:
    get:
      summary: List performance findings (filtered, paginated)
      parameters:
        - name: severity
          in: query
          schema: { type: string }
        - name: type
          in: query
          schema: { type: string }
        - name: repo
          in: query
          schema: { type: string }
        - name: q
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
  /api/performance/findings/{findingId}/optimize:
    post:
      summary: AI optimize finding (SSE stream, on-demand)
  /api/performance/findings/{findingId}:
    get:
      summary: Get performance finding
    post:
      summary: Create performance finding
    patch:
      summary: Update performance finding
    delete:
      summary: Delete performance finding
  /api/governance/rules:
    get:
      summary: List governance rules
    post:
      summary: Create governance rule
  /api/governance/rules/{ruleId}:
    get:
      summary: Get governance rule
    patch:
      summary: Update governance rule
    delete:
      summary: Delete governance rule
  /api/governance/violations:
    get:
      summary: List governance violations
  /api/governance/audit-logs:
    get:
      summary: List audit logs
    post:
      summary: Create audit log
  /api/team/members:
    get:
      summary: List team members
    post:
      summary: Create team member
  /api/team/members/{memberId}:
    get:
      summary: Get team member
    patch:
      summary: Update team member
    delete:
      summary: Delete team member
  /api/architecture/scan:
    post:
      summary: Clone repo and build dependency graph
  /api/architecture/repos/{repoId}/graph:
    get:
      summary: Dependency graph
  /api/architecture/repos/{repoId}/analyze:
    post:
      summary: Stream AI architecture analysis (on demand)
  /api/settings:
    get:
      summary: Get settings
    patch:
      summary: Update settings
  /api/settings/test-integration:
    post:
      summary: Test AI integration
  /api/settings/rotate-secret:
    post:
      summary: Rotate encrypted secrets
  /api/integrations/github/install-url:
    get:
      summary: GitHub App install URL
  /api/webhooks/github:
    post:
      summary: GitHub webhook
